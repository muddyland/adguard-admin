stages:
  - lint
  - test
  - security
  - build

# ── Package registry ──────────────────────────────────────────────────────
# Installs can go through the internal caching registry, which proxies upstream
# PyPI/npm and enforces the CVE block policy. It is **opt-in and off by
# default**, so a clone without access to it still gets a green pipeline.
#
# To turn it on, set these in Settings → CI/CD → Variables:
#
#   MINIREG_ENABLED=true   the switch; nothing below happens without it
#   MINIREG_URL            registry base URL
#   MINIREG_TOKEN          token for the registry CLI (mask it)
#   MINIREG_IP             optional — pins /etc/hosts where the runner cannot
#                          resolve the internal DNS zone
#
# The registry address is deliberately not in this file. PIP_INDEX_URL and
# NPM_CONFIG_REGISTRY are *derived* from MINIREG_URL below rather than set as
# variables of their own, so the flag is the only thing that decides where
# packages come from — setting them directly would bypass it silently.
#
# The npm lockfile keeps upstream registry.npmjs.org URLs on purpose: npm's
# default replace-registry-host=npmjs rewrites them to whichever registry is
# configured, so one lockfile works both inside and outside the network.

.use_minireg: &use_minireg |
  if [ "${MINIREG_ENABLED:-false}" = "true" ]; then
    if [ -z "${MINIREG_URL:-}" ]; then
      echo "MINIREG_ENABLED=true but MINIREG_URL is unset — refusing to fall back"
      echo "to the public registries silently, since that would skip the CVE policy."
      exit 1
    fi
    export REG_HOST=$(echo "$MINIREG_URL" | sed -E 's#^https?://([^/:]+).*#\1#')
    if [ -n "${MINIREG_IP:-}" ]; then
      echo "$MINIREG_IP $REG_HOST" >> /etc/hosts
    fi
    export PIP_INDEX_URL="${MINIREG_URL%/}/pypi/simple/"
    export NPM_CONFIG_REGISTRY="${MINIREG_URL%/}/npm/"
    echo "packages: internal registry ($REG_HOST)"
  else
    echo "packages: public registries (MINIREG_ENABLED is not true)"
  fi

# ── Shared bases ──────────────────────────────────────────────────────────

.python_base:
  image: python:3.12-slim
  tags: [saas-linux-small-amd64]
  before_script:
    - *use_minireg
    # requirements-dev pins pip itself to a patched release; upgrade first so
    # the resolver doing the work is the version we asked for.
    - pip install --quiet --upgrade "pip>=26.2"
    - pip install --quiet -r backend/requirements-dev.txt

.node_base:
  image: node:22-alpine
  tags: [saas-linux-small-amd64]
  before_script:
    - *use_minireg
    - cd frontend && npm ci

# ── Lint ──────────────────────────────────────────────────────────────────

lint:backend:
  stage: lint
  image: python:3.12-slim
  tags: [saas-linux-small-amd64]
  before_script:
    - *use_minireg
    - pip install --quiet ruff==0.14.4
  script:
    - cd backend && ruff check app tests

# ── Test ──────────────────────────────────────────────────────────────────

test:backend:
  extends: .python_base
  stage: test
  script:
    - cd backend
    # conftest.py provisions its own SECRET_KEY / FERNET_KEY, so the suite
    # exercises the same startup checks a real deployment does.
    - pytest -q

test:startup-smoke:
  extends: .python_base
  stage: test
  script:
    - cd backend
    - export SECRET_KEY=$(python -c "import secrets; print(secrets.token_urlsafe(48))")
    - export FERNET_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
    - export ADMIN_PASSWORD=$(python -c "import secrets; print(secrets.token_urlsafe(16))")
    - export DATABASE_URL="sqlite:///./ci.db"
    - export SYNC_INTERVAL_SECONDS=3600
    # Boot through the real lifespan (config gate, migrations, bootstrap admin).
    - |
      python -c "
      import os
      from fastapi.testclient import TestClient
      from app.main import app
      with TestClient(app) as c:
          assert c.get('/api/health').json()['status'] == 'ok'
          tok = c.post('/api/auth/token', data={
              'username': 'admin', 'password': os.environ['ADMIN_PASSWORD']
          }).json()['access_token']
          h = {'Authorization': f'Bearer {tok}'}
          assert c.get('/api/auth/me', headers=h).json()['role'] == 'admin'
          assert 'content-security-policy' in c.get('/api/health').headers
          print('startup smoke test OK')
      "
    # The gate must actually refuse a placeholder secret.
    - |
      SECRET_KEY="change-me-please-generate-a-long-random-string" python -c "
      from fastapi.testclient import TestClient
      from app.config import Settings, config_problems
      s = Settings()
      problems = config_problems(s)
      assert any('SECRET_KEY' in p for p in problems), problems
      print('insecure-config gate OK')
      "

build:frontend:
  extends: .node_base
  stage: test
  script:
    - npm run build
  artifacts:
    paths: [frontend/dist]
    expire_in: 14 days

# ── Security ────────────────────────────────────────────────────────────────
# Dependency vulnerability scanning. These are the checks that would have caught
# the cryptography / pydantic-settings / postcss advisories without a manual
# audit, so they run on every pipeline.

security:pip-audit:
  stage: security
  image: python:3.12-slim
  tags: [saas-linux-small-amd64]
  before_script:
    - *use_minireg
    - pip install --quiet --upgrade "pip>=26.2"
    - pip install --quiet pip-audit==2.9.0
  script:
    # pip-audit resolves through minireg but takes its advisories from PyPI/OSV,
    # so pointing the index inward does not blind it.
    - pip-audit --requirement backend/requirements.txt --strict --desc

# The npm side is audited by whichever tool can actually see advisories for the
# registry in use:
#
#   * Against the public registry, `npm audit` works as before.
#   * Against the internal one it does NOT. `npm audit` asks the *configured
#     registry* for advisories, and minireg does not serve npm's bulk-advisory
#     endpoint — so it reports "found 0 vulnerabilities" for a tree the public
#     registry flags as high. A gate that cannot fail is worse than no gate, so
#     that case uses the registry's own scanner, which reads the same lockfile
#     and does find them.
#
# Both fail at moderate/medium and above; exactly one runs per pipeline.

security:npm-audit:public:
  stage: security
  image: node:22-alpine
  tags: [saas-linux-small-amd64]
  rules:
    - if: '$MINIREG_ENABLED != "true"'
  script:
    - cd frontend
    - npm audit --audit-level=moderate

security:npm-audit:minireg:
  stage: security
  image: python:3.12-slim
  tags: [saas-linux-small-amd64]
  rules:
    - if: '$MINIREG_ENABLED == "true"'
  before_script:
    - *use_minireg
    - apt-get update -qq && apt-get install -y -qq curl
    - curl -fsSL "${MINIREG_URL%/}/api/cli/install.sh" | sh
  script:
    - export PATH="$HOME/.local/bin:$PATH"
    # The CLI reads MINIREG_URL / MINIREG_TOKEN from the environment.
    - minireg audit frontend --fail-on medium

security:osv-scanner:
  stage: security
  image:
    name: ghcr.io/google/osv-scanner:latest
    entrypoint: [""]
  tags: [saas-linux-small-amd64]
  script:
    - /osv-scanner scan source --recursive .

# ── Build image ─────────────────────────────────────────────────────────────
# Single combined image: the multi-stage Dockerfile builds the Vue SPA and bakes
# it into the FastAPI image, which serves both the API and the UI.

build:image:
  stage: build
  tags: [saas-linux-small-amd64]
  image: docker:28.6.0
  services: [docker:28.6.0-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - *use_minireg
    - until docker info; do sleep 1; done
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Pass the registry through as build args, and pin DNS for the build
    # container when the runner needs it. Unset, the Dockerfile's public
    # defaults apply.
    - |
      BUILD_ARGS=""
      if [ -n "${PIP_INDEX_URL:-}" ]; then
        BUILD_ARGS="$BUILD_ARGS --build-arg PIP_INDEX_URL=$PIP_INDEX_URL"
        BUILD_ARGS="$BUILD_ARGS --build-arg NPM_CONFIG_REGISTRY=$NPM_CONFIG_REGISTRY"
      fi
      if [ -n "${MINIREG_IP:-}" ] && [ -n "${REG_HOST:-}" ]; then
        BUILD_ARGS="$BUILD_ARGS --add-host $REG_HOST:$MINIREG_IP"
      fi
      docker build $BUILD_ARGS --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME .
    - IMAGE=$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
    - SECRET_KEY=$(docker run --rm --entrypoint python $IMAGE -c "import secrets; print(secrets.token_urlsafe(48))")
    - FERNET_KEY=$(docker run --rm --entrypoint python $IMAGE -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
    # Upgrade regression guard. The image used to run as root, so any volume from
    # an older build is root-owned; switching to uid 10001 broke every existing
    # deployment with "attempt to write a readonly database". Simulate exactly
    # that and assert the entrypoint repairs it AND still drops privileges.
    - |
      docker volume rm -f ci_legacy_data || true
      docker run --rm -v ci_legacy_data:/data --entrypoint sh $IMAGE -c \
        'python -c "import sqlite3; sqlite3.connect(\"/data/adguard_admin.db\").execute(\"CREATE TABLE t(x)\")" && chown -R 0:0 /data'
      docker run -d --name ci_upgrade -v ci_legacy_data:/data \
        -e SECRET_KEY="$SECRET_KEY" -e FERNET_KEY="$FERNET_KEY" \
        -e ADMIN_PASSWORD=ci-not-the-default -e SYNC_INTERVAL_SECONDS=3600 \
        --security-opt no-new-privileges:true \
        --cap-drop ALL --cap-add CHOWN --cap-add FOWNER --cap-add DAC_OVERRIDE \
        --cap-add SETUID --cap-add SETGID \
        $IMAGE
      for i in $(seq 1 30); do
        docker logs ci_upgrade 2>&1 | grep -q "Application startup complete" && break
        sleep 2
      done
      docker logs ci_upgrade
      docker logs ci_upgrade 2>&1 | grep -q "Application startup complete" \
        || { echo "FAIL: container did not start over a legacy root-owned volume"; exit 1; }
      RUN_UID=$(docker exec ci_upgrade awk '/^Uid:/{print $2}' /proc/1/status)
      test "$RUN_UID" = "10001" \
        || { echo "FAIL: application process runs as uid $RUN_UID, expected 10001"; exit 1; }
      echo "OK: healed a legacy volume and runs as uid $RUN_UID"
      docker rm -f ci_upgrade; docker volume rm -f ci_legacy_data
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
    - if: '$CI_COMMIT_TAG'
