services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/adguard_admin.db
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      FERNET_KEY: ${FERNET_KEY:?set FERNET_KEY in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      # No default: startup rejects "admin", so this must be set explicitly.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-60}
      SYNC_MAX_CONCURRENCY: ${SYNC_MAX_CONCURRENCY:-8}
      # UI and API share one origin now; default to the published port below.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      # Automatic AdGuard Home updates. Per-server opt-in is still required.
      AUTO_UPDATE_ENABLED: ${AUTO_UPDATE_ENABLED:-true}
      AUTO_UPDATE_DEFAULT: ${AUTO_UPDATE_DEFAULT:-false}
      AUTO_UPDATE_INTERVAL_SECONDS: ${AUTO_UPDATE_INTERVAL_SECONDS:-3600}
      # Maintenance window, HH:MM-HH:MM UTC. Empty means any time.
      AUTO_UPDATE_WINDOW: ${AUTO_UPDATE_WINDOW:-}
      # Public URL of this admin app, reachable by provisioned servers.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      PROVISION_TOKEN_TTL_HOURS: ${PROVISION_TOKEN_TTL_HOURS:-24}
      # OIDC (optional)
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:8080/api/auth/oidc/callback}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-}
      OIDC_ALLOW_USERNAME_LINKING: ${OIDC_ALLOW_USERNAME_LINKING:-false}
    volumes:
      - adguard_admin_data:/data
    ports:
      # host:container — UI + API both served on container port 8000.
      - "8080:8000"
    # The app process always runs as uid 10001. The container starts as root
    # only so the entrypoint can take ownership of a data volume left root-owned
    # by an older build, then immediately drops privileges — so it needs just
    # enough capability to chown and to change uid.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID

volumes:
  adguard_admin_data:
